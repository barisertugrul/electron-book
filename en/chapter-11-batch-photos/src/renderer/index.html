<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Batch Photos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Left: rules -->
      <aside class="rules">
        <h1 class="panel-title">Rules</h1>

        <label class="field">
          <span class="label">Name template</span>
          <input id="template" type="text" spellcheck="false" />
        </label>
        <div id="tokens" class="tokens"></div>
        <p class="hint">Example: <span id="example" class="example"></span></p>

        <label class="field">
          <span class="label">Folders</span>
          <select id="grouping"></select>
        </label>

        <label class="field">
          <span class="label">Longest edge</span>
          <select id="max-size"></select>
        </label>

        <label class="field">
          <span class="label">Quality <output id="quality-value"></output></span>
          <input id="quality" type="range" min="40" max="100" step="1" />
          <span class="hint">For JPEG and WebP files</span>
        </label>

        <label class="check">
          <input id="keep-metadata" type="checkbox" />
          <span>Keep location and camera details</span>
        </label>

        <div class="field">
          <span class="label">Output folder</span>
          <div class="output-row">
            <span id="output-dir" class="output-dir">Not chosen</span>
            <button id="btn-output" type="button">Choose…</button>
          </div>
        </div>
      </aside>

      <!-- Right: drop zone and preview list -->
      <main id="drop-target" class="photos">
        <section id="empty" class="drop-zone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v14H4z M4 15l4-4 3 3 4-5 5 6" />
          </svg>
          <p class="drop-title">Drop photos or folders here</p>
          <p class="hint">JPEG, PNG, WebP and TIFF · Subfolders are included</p>
          <button id="btn-pick-empty" type="button">Choose files…</button>
        </section>

        <section id="list" class="list" hidden>
          <header class="list-header">
            <p id="summary" class="summary"></p>
            <button id="btn-add" type="button">Add…</button>
            <button id="btn-clear" type="button">Clear</button>
          </header>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="col-thumb"></th>
                  <th>File</th>
                  <th>Date taken</th>
                  <th>New name</th>
                  <th class="col-remove"></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>

        <div class="drop-overlay" aria-hidden="true">Drop to add to the list</div>
      </main>
    </div>

    <!-- Bottom bar: status, progress, buttons -->
    <footer class="action-bar">
      <div class="status">
        <span id="status-text"></span>
        <progress id="progress" max="1" value="0" hidden></progress>
      </div>
      <button id="btn-cancel" type="button" hidden>Cancel</button>
      <button id="btn-start" type="button" class="primary" disabled>Start</button>
    </footer>

    <!-- The summary shown when the job ends -->
    <dialog id="result" class="result">
      <h2 id="result-title"></h2>
      <dl class="result-grid">
        <dt>Processed</dt>
        <dd id="result-processed"></dd>
        <dt>Failed</dt>
        <dd id="result-failed"></dd>
        <dt>Total size</dt>
        <dd id="result-size"></dd>
        <dt>Time</dt>
        <dd id="result-time"></dd>
      </dl>
      <ul id="result-errors" class="result-errors"></ul>
      <div class="result-actions">
        <button id="btn-open-output" type="button">Open folder</button>
        <button id="btn-close-result" type="button" class="primary">OK</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
