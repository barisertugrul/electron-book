<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>A First Look at Electron</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1e2a38;
        color: #f2f5f8;
      }
      main { text-align: center; }
      h1 { margin-bottom: 0.25rem; }
      p { color: #b9c6d3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, desktop!</h1>
      <p>This window is a web page, but it opened in your own app, not in a browser.</p>
      <p>Check the terminal where you started the app for version info.</p>
    </main>
  </body>
</html>
