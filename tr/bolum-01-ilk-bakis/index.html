<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Electron'a İlk Bakış</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1e2a38;
        color: #f2f5f8;
      }
      main { text-align: center; }
      h1 { margin-bottom: 0.25rem; }
      p { color: #b9c6d3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Merhaba, masaüstü!</h1>
      <p>Bu pencere bir web sayfası, ama tarayıcıda değil, kendi uygulamanızda açıldı.</p>
      <p>Sürüm bilgileri için uygulamayı başlattığınız uçbirime bakın.</p>
    </main>
  </body>
</html>
